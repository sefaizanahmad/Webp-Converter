<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Image Converter, Convert JPG, PNG, WEBP, PDF & SVG</title>
  <meta name="description" content="Convert images online for free with Faizan Ahmad's Converter Pro. Easily convert JPG, PNG, WEBP, PDF and SVG files with high quality, fast processing and no software installation.">
  <meta name="keywords" content="image converter, JPG converter, PNG converter, WEBP converter, PDF converter, SVG converter, online image converter, free image converter">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://webp-converter-vynex.vercel.app/">
  <link rel="icon" type="image/png" href="/Vynex Solutions Favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  

</head>

<body>
  <div id="icv">
    <div class="top" id="icvTop"></div>

    <div class="hd">
      <div>
        <h1>Vynex Solutions <span>Converter Pro</span></h1>
        <p class="sub">Convert to JPEG, PNG, WEBP, PDF &amp; SVG</p>
      </div>
      <div class="cnt">FILES: <span id="icvN">0</span>/100</div>
    </div>

    <div class="card ctl">
      <div class="q">
        <span class="lb">Global Quality (updates all previews)</span>
        <div class="row">
          <input type="range" id="icvQ" min="5" max="100" value="92" aria-label="Quality">
          <span class="qv" id="icvQv">92%</span>
        </div>
      </div>

      <div>
        <label class="lb" for="icvW">Max Width (px)</label>
        <input type="number" id="icvW" min="16" placeholder="Original">
      </div>

      <div>
        <label class="lb" for="icvG">Grid View</label>
        <select id="icvG">
          <option value="c1">1</option>
          <option value="c2" selected>2</option>
          <option value="c3">3</option>
          <option value="c4">4</option>
        </select>
      </div>

      <button class="go" id="icvGo">Process All</button>
    </div>

    <label class="drop" id="icvDrop" for="icvFile">
      <input type="file" id="icvFile" accept="image/*" multiple hidden>
      <div class="plus">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M12 4v16m8-8H4" />
        </svg>
      </div>
      <b>Drop Images Here</b>
      <span>Files are processed 100% locally in your browser</span>
    </label>

    <div class="gal c2" id="icvGal"></div>

    <div class="bar" id="icvBar">
      <span class="t">Batch Download As:</span>
      <select id="icvF" aria-label="Batch format">
        <option value="webp">WEBP (High Quality)</option>
        <option value="webpl">WEBP Lossless (Max Quality)</option>
        <option value="jpeg">JPEG (Standard)</option>
        <option value="png">PNG (High Quality)</option>
        <option value="pdf">PDF (Document)</option>
        <option value="svg">SVG (Embedded)</option>
      </select>
      <button class="dl" id="icvAll">Download All Files (ZIP)</button>
      <button class="cl" id="icvClear">Clear</button>
    </div>

    <p class="info"> &copy; 2026 Copyrights all rights reserved. Developed by
      <a href="https://vynexsolutions.com/" target="_blank" rel="noopener noreferrer"> Vynex Solutions</a>
   </p>
  </div>

  <script>
    (function () {
      var $ = function (i) { return document.getElementById(i) };
      var items = [], uid = 0, tm, MAX = 100, showBar = false;

      var EXT = {
        webp: 'webp',
        webpl: 'webp',
        jpeg: 'jpg',
        png: 'png',
        pdf: 'pdf',
        svg: 'svg'
      };

      function fb(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(2) + ' MB';
      }

      function esc(s) {
        return s.replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      async function convert(it, f) {
        var q = it.q / 100;
        var mw = parseInt($('icvW').value) || 0;
        var w = it.img.naturalWidth;
        var h = it.img.naturalHeight;

        if (mw && mw < w) {
          h = Math.round(h * mw / w);
          w = mw;
        }

        var c = document.createElement('canvas');
        c.width = w;
        c.height = h;

        var x = c.getContext('2d');
        x.imageSmoothingQuality = 'high';

        if (f === 'jpeg' || f === 'pdf') {
          x.fillStyle = '#fff';
          x.fillRect(0, 0, w, h);
        }

        x.drawImage(it.img, 0, 0, w, h);

        if (f === 'pdf') {
          var p = new window.jspdf.jsPDF({
            orientation: w > h ? 'l' : 'p',
            unit: 'px',
            format: [w, h],
            compress: true
          });
          p.addImage(c.toDataURL('image/jpeg', q), 'JPEG', 0, 0, w, h);
          return p.output('blob');
        }

        if (f === 'svg') {
          return new Blob([
            '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
            '<image href="' + c.toDataURL('image/png') + '" width="' + w + '" height="' + h + '"/>' +
            '</svg>'
          ], { type: 'image/svg+xml' });
        }

        return new Promise(function (resolve) {
          c.toBlob(
            resolve,
            'image/' + (f === 'webpl' ? 'webp' : f),
            f === 'webpl' ? 1 : q
          );
        });
      }

      async function preview(it) {
        var fv = $('icvF').value;
        var b = await convert(it, fv);
        var el = $('sz' + it.id);

        if ((fv === 'webp' || fv === 'webpl') && b && b.type !== 'image/webp' && !window.__icvW) {
          window.__icvW = 1;
          alert('Is browser mein WEBP support nahi hai. Chrome ya Edge use karein.');
        }

        if (el && b) {
          el.innerHTML = '<em>' + fb(b.size) + '</em><s>' + fb(it.file.size) + '</s>';
        }
      }

      async function all(bar) {
        var t = $('icvTop');

        for (var i = 0; i < items.length; i++) {
          await preview(items[i]);
          if (bar) {
            t.style.width = ((i + 1) / items.length * 100) + '%';
          }
        }

        if (bar) {
          setTimeout(function () {
            t.style.width = '0';
          }, 500);
        }
      }

      function later() {
        clearTimeout(tm);
        tm = setTimeout(function () {
          all(false);
        }, 250);
      }

      function render() {
        $('icvN').textContent = items.length;
        $('icvBar').classList.toggle('on', showBar && items.length > 0);

        $('icvGal').innerHTML = items.map(function (it) {
          return '<div class="card it">' +
            '<div class="th">' +
            '<img src="' + it.url + '" alt="">' +
            '<div class="sz" id="sz' + it.id + '">' + fb(it.file.size) + '</div>' +
            '<button class="rm" data-rm="' + it.id + '" aria-label="Remove">&times;</button>' +
            '</div>' +
            '<div class="nm">' + esc(it.file.name) + '</div>' +
            '<div class="qh">' +
            '<label>Quality Control</label>' +
            '<span id="qv' + it.id + '">' + it.q + '%</span>' +
            '</div>' +
            '<input type="range" min="5" max="100" value="' + it.q + '" data-q="' + it.id + '">' +
            '<div class="fm">' +
            ['webp', 'jpeg', 'png', 'pdf', 'svg'].map(function (f) {
              return '<button data-dl="' + it.id + '" data-f="' + f + '">' +
                (f === 'jpeg' ? 'JPEG' : f.toUpperCase()) +
                '</button>';
            }).join('') +
            '</div>' +
            '</div>';
        }).join('');
      }

      function add(files) {
        var list = Array.from(files)
          .filter(function (f) { return f.type.indexOf('image/') === 0 })
          .slice(0, MAX - items.length);

        var n = 0;
        if (!list.length) return;

        list.forEach(function (file) {
          var url = URL.createObjectURL(file);
          var img = new Image();

          function done() {
            n++;
            if (n === list.length) {
              render();
              all(false);
            }
          }

          img.onload = function () {
            items.push({
              id: ++uid,
              file: file,
              url: url,
              img: img,
              q: parseInt($('icvQ').value)
            });
            done();
          };

          img.onerror = done;
          img.src = url;
        });
      }

      function save(b, name) {
        var url = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 4000);
      }

      function nm(it, f) {
        return it.file.name.replace(/\.[^.]+$/, '') + '.' + EXT[f];
      }

      $('icvFile').onchange = function (e) {
        add(e.target.files);
        e.target.value = '';
      };

      var dz = $('icvDrop');

      ['dragenter', 'dragover'].forEach(function (t) {
        dz.addEventListener(t, function (e) {
          e.preventDefault();
          dz.classList.add('on');
        });
      });

      ['dragleave', 'drop'].forEach(function (t) {
        dz.addEventListener(t, function (e) {
          e.preventDefault();
          dz.classList.remove('on');
        });
      });

      dz.addEventListener('drop', function (e) {
        add(e.dataTransfer.files);
      });

      $('icvQ').oninput = function () {
        var v = parseInt(this.value);
        $('icvQv').textContent = v + '%';

        items.forEach(function (it) {
          it.q = v;

          var s = $('qv' + it.id);
          if (s) s.textContent = v + '%';

          var r = document.querySelector('#icv [data-q="' + it.id + '"]');
          if (r) r.value = v;
        });

        later();
      };

      $('icvW').oninput = later;
      $('icvF').onchange = later;

      $('icvG').onchange = function () {
        $('icvGal').className = 'gal ' + this.value;
      };

      $('icvGo').onclick = function () {
        if (!items.length) return;

        all(true).then(function () {
          showBar = true;
          $('icvBar').classList.add('on');
        });
      };

      $('icvGal').addEventListener('input', function (e) {
        var id = e.target.getAttribute('data-q');
        if (!id) return;

        var it = items.find(function (i) { return i.id == id });
        if (!it) return;

        it.q = parseInt(e.target.value);
        $('qv' + id).textContent = it.q + '%';

        clearTimeout(tm);
        tm = setTimeout(function () {
          preview(it);
        }, 200);
      });

      $('icvGal').addEventListener('click', function (e) {
        var r = e.target.getAttribute('data-rm');
        var d = e.target.getAttribute('data-dl');

        if (r) {
          var removed = items.find(function (i) { return i.id == r });
          if (removed) URL.revokeObjectURL(removed.url);

          items = items.filter(function (i) { return i.id != r });
          render();
          all(false);
        }

        if (d) {
          var it = items.find(function (i) { return i.id == d });
          var f = e.target.getAttribute('data-f');

          if (it && f) {
            convert(it, f).then(function (b) {
              save(b, nm(it, f));
            });
          }
        }
      });

      $('icvClear').onclick = function () {
        items.forEach(function (it) {
          URL.revokeObjectURL(it.url);
        });

        items = [];
        showBar = false;
        render();
      };

      $('icvAll').onclick = async function () {
        var b = this;
        var f = $('icvF').value;
        var z = new JSZip();
        var seen = {};

        b.textContent = 'Preparing ZIP...';

        for (var it of items) {
          var n = nm(it, f);

          if (seen[n]) {
            n = n.replace(/(\.[^.]+)$/, '-' + seen[n]++ + '$1');
          } else {
            seen[n] = 1;
          }

          z.file(n, await convert(it, f));
        }

        save(
          await z.generateAsync({ type: 'blob' }),
          'converted-images.zip'
        );

        b.textContent = 'Download All Files (ZIP)';
      };
    })();
  </script>
</body>

</html>
